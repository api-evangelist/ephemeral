description: Ephemeral is a body-art company that makes semi-permanent, made-to-fade tattoos using a proprietary
  vegan, medical-grade polymer ink engineered to fade from the skin over roughly one to two years. Backed by
  Canaan Partners, the company sells direct-to-consumer through certified partner tattoo artists in select
  cities and business-to-business by supplying its Generation-3 ink to professional artists. It is a consumer
  and physical-product business, not a technology or API provider - as of this enrichment pass it publishes no
  public API, SDK, developer portal, or developer documentation.
